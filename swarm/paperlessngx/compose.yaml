networks:
  default: null
  proxy:
    external: true
services:
  paperlessngx:
    environment:
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_DBHOST: ${db_host:?}
      PAPERLESS_DBNAME: ${db_name:-paperless}
      PAPERLESS_DBPASS: ${db_pass:?}
      PAPERLESS_DBPORT: ${db_port:-5432}
      PAPERLESS_DBUSER: ${db_user:-paperless}
      PAPERLESS_REDIS: ${redis_url:?}
      PAPERLESS_SECRET_KEY: ${secret_key:?}
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket-ID","client_id":"${client_id:?}","secret":"${client_secret:?}","settings":{"server_url":"https://id.dellhplaptop.xyz"}}]}}'
      PAPERLESS_TIME_ZONE: ${timezone:-UTC}
      PAPERLESS_URL: https://pl.dellhplaptop.xyz
      USERMAP_GID: ${gid:-1000}
      USERMAP_UID: ${uid:-1000}
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
    deploy:
      labels:
        homepage.group: Personal
        homepage.href: https://pl.dellhplaptop.xyz
        homepage.icon: sh-paperless-ngx.svg
        homepage.name: Paperless
        release_notes: "https://github.com/paperless-ngx/paperless-ngx/releases"
        traefik.enable: "true"
        traefik.http.routers.paperlessngx.entryPoints: "https"
        traefik.http.routers.paperlessngx.middlewares: "allowedIPs@file,tinyauth@swarm"
        traefik.http.routers.paperlessngx.rule: "Host(`pl.dellhplaptop.xyz`)"
        traefik.http.services.paperlessngx.loadbalancer.server.port: 8000
    networks:
      proxy: null
      default: null
    volumes:
      - /mnt/docker/paperless/app:/usr/src/paperless
