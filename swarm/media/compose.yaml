networks:
  freshrss:
  proxy:
    external: true
services:
  freshrss:
    environment:
      CRON_MIN: "1,31"
      LISTEN: 0.0.0.0:80
      OIDC_CLIENT_ID: ${client_id:?}
      OIDC_CLIENT_SECRET: ${client_secret:?}
      OIDC_ENABLED: "1"
      OIDC_PROVIDER_METADATA_URL: https://id.dellhplaptop.xyz/.well-known/openid-configuration
      OIDC_REMOTE_USER_CLAIM: preferred_username
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      TRUSTED_PROXY: "0"
      TZ: ${timezone:-UTC}
    image: freshrss/freshrss:${freshrss_version:-latest}
    deploy:
      placement:
        constraints:
          - node.hostname == node-2
      labels:
        homepage.group: Personal
        homepage.href: https://rss.dellhplaptop.xyz
        homepage.icon: sh-freshrss.svg
        homepage.name: Freshrss
        homepage.widget.password: ${freshrss_user_password:-.unset}
        homepage.widget.type: freshrss
        homepage.widget.url: http://freshrss:80
        homepage.widget.username: ${freshrss_user_name:-.unset}
        kuma.__docker:
        release_notes: "https://github.com/linuxserver/docker-freshrss/releases"
        traefik.enable: "true"
        traefik.http.routers.freshrss.entryPoints: "https"
        traefik.http.routers.freshrss.middlewares: "allowedIPs@file"
        traefik.http.routers.freshrss.rule: "Host(`rss.dellhplaptop.xyz`)"
        traefik.http.services.freshrss.loadbalancer.server.port: 80
      update_config:
        order: stop-first
    networks:
      freshrss:
      proxy:
    volumes:
      - /etc/docker/freshrss/data:/var/www/FreshRSS/data
      - /etc/docker/freshrss/extensions:/var/www/FreshRSS/extensions
  kavita:
    environment:
      TZ: ${timezone:-UTC}
    image: ghcr.io/kareadita/kavita:${kavita_version:-latest}
    deploy:
      placement:
        constraints:
          - node.hostname == node-3
      labels:
        homepage.group: Media Consumption
        homepage.href: https://kv.dellhplaptop.xyz
        homepage.icon: sh-kavita.svg
        homepage.name: Kavita
        kuma.__docker:
        release_notes: "https://github.com/Kareadita/Kavita/releases"
        traefik.enable: "true"
        traefik.http.routers.kavita.entryPoints: "https"
        traefik.http.routers.kavita.middlewares: "allowedIPs@file"
        traefik.http.routers.kavita.rule: "Host(`kv.dellhplaptop.xyz`)"
        traefik.http.services.kavita.loadbalancer.server.port: 5000
      update_config:
        order: stop-first
    networks:
      proxy: null
    volumes:
      - /etc/docker/kavita:/kavita/config
      - /mnt/media/Books:/books
  navidrome:
    environment:
      ND_AGENTS: "lastfm,deezer,listenbrainz"
      ND_BASEURL: https://mu.dellhplaptop.xyz
      ND_ENABLEINSIGHTSCOLLECTOR: "${navi_analytics:-false}"
      ND_ENABLEUSEREDITING: "false"
      ND_EXTAUTH_TRUSTEDSOURCES: ${trusted_proxy:-172.30.0.0/16}
      ND_LASTFM_APIKEY: ${lastfm_key:-}
      ND_LASTFM_SECRET: ${lastfm_secret:-}
      ND_LOGLEVEL: info
    image: deluan/navidrome:${navidrome_version:-latest}
    deploy:
      placement:
        constraints:
          - node.hostname == node-2
      labels:
        homepage.group: Media Consumption
        homepage.href: https://mu.dellhplaptop.xyz
        homepage.icon: sh-navidrome.svg
        homepage.name: Navidrome
        kuma.__docker:
        release_notes: "https://github.com/navidrome/navidrome/releases"
        traefik.enable: "true"
        traefik.http.routers.navidrome.entryPoints: "https"
        traefik.http.routers.navidrome.middlewares: "allowedIPs@file,tinyauth@swarm"
        traefik.http.routers.navidrome.rule: "Host(`mu.dellhplaptop.xyz`)"
        traefik.http.services.navidrome.loadbalancer.server.port: 4533
    networks:
      proxy:
    user: 1000:1000
    volumes:
      - "/etc/docker/navidrome:/data:rw"
      - "/mnt/media/Music:/music:rw"
  seerr:
    environment:
      LOG_LEVEL: ${log_level:-warn}
      TZ: ${timezone:-UTC}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 20s
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      timeout: 3s
    image: ghcr.io/seerr-team/seerr:${seerr_version:-latest}
    init: true
    deploy:
      placement:
        constraints:
          - node.hostname == node-1
      labels:
        homepage.group: Arr Stack
        homepage.href: https://se.dellhplaptop.xyz
        homepage.icon: sh-seerr.svg
        homepage.name: Seerr
        kuma.__docker:
        release_notes: "https://github.com/seerr-team/seerr/releases"
        traefik.enable: "true"
        traefik.http.routers.seerr.entryPoints: "https"
        traefik.http.routers.seerr.middlewares: "allowedIPs@file"
        traefik.http.routers.seerr.rule: "Host(`se.dellhplaptop.xyz`)"
        traefik.http.services.seerr.loadbalancer.server.port: 5055
      update_config:
        order: stop-first
    networks:
      proxy: null
    volumes:
      - /etc/docker/seerr:/app/config/:rw
