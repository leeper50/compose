networks:
  default:
    driver: bridge
    enable_ipv6: ${enable_ipv6_bool:-true}
services:
  gluetun_proxy:
    extends:
      file: ../common.yaml
      service: base
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    container_name: gluetun_proxy
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HTTPPROXY: on
      SERVER_CITIES: ${cities:-Stockholm}
      SOCKS5_ENABLED: on
      TZ: ${timezone:-UTC}
      VPN_SERVICE_PROVIDER: ${provider:?}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${wgkey:?}
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    image: qmcgaw/gluetun:${gluetun_version:-latest}
    labels:
      kuma.__docker:
      release_notes: "https://github.com/qdm12/gluetun/releases"
    ports:
      - "${listen_interface:-0.0.0.0}:1080:1080/tcp"
      - "${listen_interface:-0.0.0.0}:8888:8888/tcp"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=${disable_ipv6_int:-0}
    volumes:
      - ${data:-.}/gluetun-proxy:/gluetun:rw
