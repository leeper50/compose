networks:
  default: null
  proxy:
    external: true
services:
  immich_postgres:
    environment:
      POSTGRES_DB: ${db_name:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_PASSWORD: ${db_pass:?}
      POSTGRES_USER: ${db_user:-immich}
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://www.postgresql.org/docs/release/"
    networks:
      default: null
    shm_size: 128mb
    volumes:
      - /mnt/docker/immich/db:/var/lib/postgresql/data
  immich_valkey:
    healthcheck:
      test: valkey-cli ping || exit 1
    image: valkey/valkey:${valkey_version:-9}
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://github.com/valkey-io/valkey/releases"
    networks:
      default: null
    volumes:
      - /mnt/docker/immich/valkey:/data
  immich-machine-learning:
    environment:
      DB_DATABASE_NAME: ${db_name:-immich}
      DB_PASSWORD: ${db_pass:?}
      DB_USERNAME: ${db_user:-immich}
      TZ: ${timezone:-UTC}
    healthcheck:
      disable: false
    image: ghcr.io/immich-app/immich-machine-learning:${immich_version:-release}
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://github.com/immich-app/immich/releases"
    networks:
      default: null
    volumes:
      - /mnt/docker/immich/model-cache:/cache
  immich:
    environment:
      DB_DATABASE_NAME: ${db_name:-immich}
      DB_HOSTNAME: immich_postgres
      DB_PASSWORD: ${db_pass:?}
      DB_USERNAME: ${db_user:-immich}
      REDIS_HOSTNAME: immich_valkey
      TZ: ${timezone:-UTC}
    healthcheck:
      disable: false
    image: ghcr.io/immich-app/immich-server:${immich_version:-release}
    deploy:
      labels:
        homepage.group: Media Consumption
        homepage.href: https://im.buncha.men
        homepage.icon: sh-immich.svg
        homepage.name: Immich
        kuma.__docker:
        release_notes: "https://github.com/immich-app/immich/releases"
        traefik.enable: "true"
        traefik.http.routers.immich.entryPoints: "https"
        traefik.http.routers.immich.middlewares: "localonly@file"
        traefik.http.routers.immich.rule: "Host(`im.buncha.men`)"
        traefik.http.services.immich.loadbalancer.server.port: 2283
    networks:
      proxy: null
      default: null
    volumes:
      - /mnt/docker/immich/app:/data
      - /etc/localtime:/etc/localtime:ro
