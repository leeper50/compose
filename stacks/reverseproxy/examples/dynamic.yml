allowedIPs: &allowedIPs
  sourceRange:
    - "10.0.0.0/8"
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "1.1.1.1/32"
localIPs: &localIPs
  sourceRange:
    - "10.0.0.0/8"
    - "192.168.0.0/16"
    - "172.16.0.0/12"
http:
  middlewares:
    allowedIPs:
      ipAllowList:
        <<: *allowedIPs
    localonly:
      ipAllowList:
        <<: *localIPs
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true
tcp:
  middlewares:
    allowedIPs:
      ipAllowList:
        <<: *allowedIPs
    localonly:
      ipAllowList:
        <<: *localIPs
