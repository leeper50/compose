accessLog:
  filePath: /var/log/traefik/access.log
  filters:
    minDuration: 1000ms
    retryAttempts: true
    statusCodes:
      - 400-499
      - 500-599

api:
  dashboard: true
  insecure: false

certificatesResolvers:
  your-cert-provider:
    acme:
      caServer: https://acme-v02.api.letsencrypt.org/directory
      email: youremail@example.com
      dnsChallenge:
        provider: your-cert-provider
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53
      storage: /acme.json

entryPoints:
  http:
    address: :80
    http:
      redirections:
        entryPoint:
          permanent: true
          scheme: https
          to: https
  https:
    address: :443
    http3: {}
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - 172.16.0.0/12
    proxyProtocol:
      insecure: false
      trustedIPs:
        - 172.16.0.0/12
    transport:
      respondingTimeouts:
        idleTimeout: 600s
        readTimeout: 600s
        writeTimeout: 600s
    http:
      tls:
        certResolver: your-cert-provider
        domains:
          - main: yourdomain.com
            sans:
              - "*.yourdomain.com"
  metrics:
    address: :8082
  minecraft:
    address: :25565
  terraria:
    address: :7777

log:
  compress: true
  filePath: /var/log/traefik/traefik.log
  level: INFO
  maxAge: 7
  maxSize: 25

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0
    entryPoint: metrics

providers:
  swarm:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    network: proxy
  file:
    filename: /dynamic.yml
    watch: true

serversTransport:
  insecureSkipVerify: true
