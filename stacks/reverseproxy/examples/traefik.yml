accessLog:
  filePath: /var/log/traefik/access.log
  filters:
    retryAttempts: true
    statusCodes:
      - 400-499
      - 500-599
  format: json

api:
  dashboard: true
  insecure: false

certificatesResolvers:
  cloudflare:
    acme:
      email: dellhplaptop@pm.me
      storage: /etc/traefik/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53

entryPoints:
  http:
    address: :80
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: :443
    http3: {}
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - 172.30.0.0/16
        - fd06:6a55:3bd2:ed3d::/64
    proxyProtocol:
      insecure: false
      trustedIPs:
        - 172.30.0.0/16
        - fd06:6a55:3bd2:ed3d::/64
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s
        writeTimeout: 600s
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: buncha.men
            sans:
              - "*.buncha.men"
  minecraft:
    address: :25565
  terraria:
    address: :7777

log:
  level: INFO

providers:
  docker:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    network: proxy
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
