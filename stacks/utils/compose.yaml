networks:
  proxy:
    external: true
  searxng:
services:
  ittools:
    extends:
      file: ../common.yaml
      service: base
    cap_drop:
      - ALL
    container_name: ittools
    image: "ghcr.io/sharevb/it-tools:${ittools_version:-latest}"
    labels:
      homepage.group: Development
      homepage.href: https://it.dellhplaptop.xyz
      homepage.icon: sh-it-tools.svg
      homepage.name: ItTools
      kuma.__docker:
      release_notes: "https://github.com/CorentinTh/it-tools/releases"
      traefik.enable: "true"
      traefik.http.routers.ittools.entryPoints: "https"
      traefik.http.routers.ittools.middlewares: "allowedIPs@file"
      traefik.http.routers.ittools.rule: "Host(`it.dellhplaptop.xyz`)"
      traefik.http.services.ittools.loadbalancer.server.url: "http://ittools:8080"
    networks:
      proxy: null
  searxng-core:
    extends:
      file: ../common.yaml
      service: base
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    container_name: searxng-core
    depends_on:
      - searxng-valkey
    environment:
      SEARXNG_BASE_URL: "https://sx.dellhplaptop.xyz"
      SEARXNG_SECRET: ${searxng_secret:?}
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
    image: "ghcr.io/searxng/searxng:${searxng_version:-latest}"
    labels:
      homepage.group: Personal
      homepage.href: https://sx.dellhplaptop.xyz
      homepage.icon: sh-searxng.svg
      homepage.name: SearxNG
      kuma.__docker:
      release_notes: "https://docs.searxng.org/index.html"
      traefik.enable: "true"
      traefik.http.routers.searxng.entryPoints: "https"
      traefik.http.routers.searxng.middlewares: "allowedIPs@file"
      traefik.http.routers.searxng.rule: "Host(`sx.dellhplaptop.xyz`)"
      traefik.http.services.searxng.loadbalancer.server.url: "http://searxng-core:8080"
    networks:
      proxy: null
      searxng: null
    volumes:
      - ${data:-.}/searxng/config:/etc/searxng
      - ${data:-.}/searxng/data:/var/cache/searxng
  searxng-valkey:
    extends:
      file: ../common.yaml
      service: base
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    container_name: searxng-valkey
    healthcheck:
      test: valkey-cli ping || exit 1
    image: valkey/valkey:${valkey_version:-9}
    labels:
      kuma.__docker:
      release_notes: "https://github.com/valkey-io/valkey/releases"
    networks:
      searxng:
    volumes:
      - ${data:-.}/searxng/valkey:/data
