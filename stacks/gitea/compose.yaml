networks:
  default: null
  proxy:
    external: true
  socket-proxy:
    external: true
services:
  gitea:
    environment:
      GITEA__actions__ENABLED: true
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea_db:5432
      GITEA__database__NAME: ${db_name:-gitea}
      GITEA__database__PASSWD: ${db_pass:?}
      GITEA__database__USER: ${db_user:-gitea}
      GITEA__server__DISABLE_SSH: true
      GITEA__server__ROOT_URL: https://git.buncha.men/
    image: docker.gitea.com/gitea:${gitea_version:-1.26-rootless}
    deploy:
      labels:
        homepage.group: Development
        homepage.href: https://git.buncha.men
        homepage.icon: sh-gitea.svg
        homepage.name: Gitea
        kuma.__docker:
        release_notes: "https://github.com/go-gitea/gitea/releases"
        traefik.enable: "true"
        traefik.http.routers.gitea.entryPoints: "https"
        traefik.http.routers.gitea.rule: "Host(`git.buncha.men`)"
        traefik.http.services.gitea.loadbalancer.server.port: 3000
    networks:
      proxy: null
      default: null
    user: ${uid:-1000}:${gid:-1000}
    volumes:
      - /mnt/docker/gitea/data:/var/lib/gitea:rw
      - /mnt/docker/gitea/config:/etc/gitea:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
  gitea_db:
    environment:
      POSTGRES_DB: ${db_name:-gitea}
      POSTGRES_PASSWORD: ${db_pass:?}
      POSTGRES_USER: ${db_user:-gitea}
    image: postgres:${postgres_version:-14}
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://www.postgresql.org/docs/release/"
    networks:
      default: null
    volumes:
      - /mnt/docker/gitea/db:/var/lib/postgresql/data
  gitea_runner:
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      GITEA_INSTANCE_URL: https://git.buncha.men/
      GITEA_RUNNER_LABELS:
        "docker:docker://data.forgejo.org/oci/node:20-bullseye,\
        ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest,\
        ubuntu-22.04:docker://docker.gitea.com/runner-images:ubuntu-22.04,\
        ubuntu-20.04:docker://docker.gitea.com/runner-images:ubuntu-20.04"
      GITEA_RUNNER_NAME: gitea_runner
      GITEA_RUNNER_REGISTRATION_TOKEN: ${token}
    image: gitea/act_runner:${runner_version:-nightly}
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://gitea.com/gitea/runner/releases"
    networks:
      default: null
      socket-proxy: null
    volumes:
      - /mnt/docker/gitea/runner:/data
