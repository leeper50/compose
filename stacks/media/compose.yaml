networks:
  freshrss:
  proxy:
    external: true
services:
  freshrss:
    environment:
      CRON_MIN: "1,31"
      LISTEN: 0.0.0.0:80
      OIDC_CLIENT_ID: ${client_id:?}
      OIDC_CLIENT_SECRET: ${client_secret:?}
      OIDC_ENABLED: 1
      OIDC_PROVIDER_METADATA_URL: https://id.buncha.men/.well-known/openid-configuration
      OIDC_REMOTE_USER_CLAIM: preferred_username
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      TRUSTED_PROXY: 0
      TZ: ${timezone:-UTC}
    image: freshrss/freshrss:${freshrss_version:-latest}
    deploy:
      labels:
        homepage.group: Personal
        homepage.href: https://rss.buncha.men
        homepage.icon: sh-freshrss.svg
        homepage.name: Freshrss
        homepage.widget.password: ${freshrss_user_password:-.unset}
        homepage.widget.type: freshrss
        homepage.widget.url: http://freshrss:80
        homepage.widget.username: ${freshrss_user_name:-.unset}
        kuma.__docker:
        release_notes: "https://github.com/linuxserver/docker-freshrss/releases"
        traefik.enable: "true"
        traefik.http.routers.freshrss.entryPoints: "https"
        traefik.http.routers.freshrss.middlewares: "allowedIPs@file"
        traefik.http.routers.freshrss.rule: "Host(`rss.buncha.men`)"
        traefik.http.services.freshrss.loadbalancer.server.port: 80
    networks:
      freshrss:
      proxy:
    volumes:
      - /mnt/docker/freshrss/data:/var/www/FreshRSS/data
      - /mnt/docker/freshrss/extensions:/var/www/FreshRSS/extensions
  freshrss_postgres:
    environment:
      POSTGRES_DB: ${db_name:-freshrss}
      POSTGRES_PASSWORD: ${db_pass:?}
      POSTGRES_USER: ${db_user:-freshrss}
    image: postgres:${postgres_version:-16}
    deploy:
      labels:
        kuma.__docker:
        release_notes: "https://www.postgresql.org/docs/release/"
    networks:
      freshrss:
    volumes:
      - /mnt/docker/freshrss/db:/var/lib/postgresql/data
  jellyfin:
    devices:
      - /dev/dri
    environment:
      JELLYFIN_PublishedServerUrl: jf.buncha.men
      PGID: ${gid:-1000}
      PUID: ${uid:-1000}
      TZ: ${timezone:-UTC}
    image: lscr.io/linuxserver/jellyfin:${jellyfin_version:-latest}
    deploy:
      labels:
        homepage.group: Media Consumption
        homepage.href: https://jf.buncha.men
        homepage.icon: sh-jellyfin.svg
        homepage.name: Jellyfin
        kuma.__docker:
        release_notes: "https://docs.linuxserver.io/images/docker-jellyfin/#versions"
        traefik.enable: "true"
        traefik.http.routers.jellyfin.entryPoints: "https"
        traefik.http.routers.jellyfin.middlewares: "allowedIPs@file"
        traefik.http.routers.jellyfin.rule: "Host(`jf.buncha.men`)"
        traefik.http.services.jellyfin.loadbalancer.server.port: 8096
    networks:
      proxy: null
    ports:
      - "7359:7359/udp" # Client Discovery
    volumes:
      - /mnt/docker/jellyfin:/config:rw
      - /mnt/media/TV:/data/tvshows:rw
      - /mnt/media/Movies:/data/movies:rw
      - /mnt/media/Music:/data/music:rw
  kavita:
    environment:
      TZ: ${timezone:-UTC}
    image: ghcr.io/kareadita/kavita:${kavita_version:-latest}
    deploy:
      labels:
        homepage.group: Media Consumption
        homepage.href: https://kv.buncha.men
        homepage.icon: sh-kavita.svg
        homepage.name: Kavita
        kuma.__docker:
        release_notes: "https://github.com/Kareadita/Kavita/releases"
        traefik.enable: "true"
        traefik.http.routers.kavita.entryPoints: "https"
        traefik.http.routers.kavita.middlewares: "allowedIPs@file"
        traefik.http.routers.kavita.rule: "Host(`kv.buncha.men`)"
        traefik.http.services.kavita.loadbalancer.server.port: 5000
    networks:
      proxy: null
    volumes:
      - /mnt/docker/kavita:/kavita/config
      - /mnt/media/Books:/books
  navidrome:
    environment:
      ND_ENABLEINSIGHTSCOLLECTOR: ${navi_analytics:-true}
      ND_ENABLEUSEREDITING: false
      ND_REVERSEPROXYWHITELIST: 0.0.0.0/0
    image: ghcr.io/navidrome/navidrome:${navidrome_version:-latest}
    deploy:
      labels:
        homepage.group: Media Consumption
        homepage.href: https://nav.buncha.men
        homepage.icon: sh-navidrome.svg
        homepage.name: Navidrome
        kuma.__docker:
        release_notes: "https://github.com/navidrome/navidrome/releases"
        traefik.enable: "true"
        traefik.http.routers.navidrome.entryPoints: "https"
        traefik.http.routers.navidrome.middlewares: "allowedIPs@file, tinyauth@file"
        traefik.http.routers.navidrome.priority: 30
        traefik.http.routers.navidrome.rule: "Host(`nav.buncha.men`)"
        traefik.http.services.navidrome.loadbalancer.server.port: 4533
        # App specific auth with basic-auth
        traefik.http.routers.navidrome-subsonic.entrypoints: "https"
        traefik.http.routers.navidrome-subsonic.middlewares: "allowedIPs@file"
        traefik.http.routers.navidrome-subsonic.priority: 50
        traefik.http.routers.navidrome-subsonic.rule: Host(`nav.buncha.men`) && PathPrefix(`/rest/`) && !Query(`c`, `NavidromeUI`)
    networks:
      proxy: null
    user: ${uid:-1000}:${gid:-1000}
    volumes:
      - /mnt/docker/navidrome:/data:rw
      - /mnt/media/Music:/music:ro
  seerr:
    environment:
      LOG_LEVEL: ${log_level:-warn}
      TZ: ${timezone:-UTC}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 20s
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      timeout: 3s
    image: ghcr.io/seerr-team/seerr:${seerr_version:-latest}
    init: true
    deploy:
      labels:
        homepage.group: Arr Stack
        homepage.href: https://se.buncha.men
        homepage.icon: sh-seerr.svg
        homepage.name: Seerr
        kuma.__docker:
        release_notes: "https://github.com/seerr-team/seerr/releases"
        traefik.enable: "true"
        traefik.http.routers.seerr.entryPoints: "https"
        traefik.http.routers.seerr.middlewares: "allowedIPs@file,tinyauth@file"
        traefik.http.routers.seerr.rule: "Host(`se.buncha.men`)"
        traefik.http.services.seerr.loadbalancer.server.port: 5055
    networks:
      proxy: null
    volumes:
      - /mnt/docker/seerr:/app/config/:rw