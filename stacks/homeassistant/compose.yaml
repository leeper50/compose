networks:
  proxy:
    external: true
services:
  homeassistant:
    container_name: homeassistant
    depends_on:
      zwave_js_ui:
        condition: service_healthy
        restart: true
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 120s
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8123/manifest.json"]
      timeout: 10s
    image: ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
    labels:
      homepage.group: Smart Home
      homepage.href: https://ha.dellhplaptop.xyz
      homepage.icon: sh-home-assistant.svg
      homepage.name: Home Assistant
      release_notes: "https://github.com/home-assistant/docker/releases"
      traefik.enable: "true"
      traefik.http.routers.homeassistant.entryPoints: "https"
      traefik.http.routers.homeassistant.middlewares: "localonly@file"
      traefik.http.routers.homeassistant.rule: "Host(`ha.dellhplaptop.xyz`)"
      traefik.http.services.homeassistant.loadbalancer.server.port: 8123
    networks:
      proxy: null
    restart: unless-stopped
    volumes:
      - /etc/docker/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
  zwave_js_ui:
    container_name: zwave_js_ui
    devices:
      - /dev/serial/by-id/${zwave_device:?}:/dev/ttyACM0
    environment:
      SESSION_SECRET: ${key:?}
      TZ: ${timezone:-UTC}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8091/health"]
      timeout: 10s
    image: ghcr.io/zwave-js/zwave-js-ui:11.27.0@sha256:0f3ad23ccf5ff2256ad8cc060ab0fc987b8f52a8427eac337f93b058fa628f35
    labels:
      homepage.group: Smart Home
      homepage.href: https://zw.dellhplaptop.xyz
      homepage.icon: sh-z-wave-js-ui.svg
      homepage.name: ZWave
      release_notes: "https://github.com/zwave-js/zwave-js-ui/releases"
      traefik.enable: "true"
      traefik.http.routers.zwave.entryPoints: "https"
      traefik.http.routers.zwave.middlewares: "localonly@file"
      traefik.http.routers.zwave.rule: "Host(`zw.dellhplaptop.xyz`)"
      traefik.http.services.zwave.loadbalancer.server.port: 8091
    networks:
      proxy:
    restart: unless-stopped
    stop_signal: SIGINT
    tty: true
    volumes:
      - /etc/docker/zwave:/usr/src/app/store
